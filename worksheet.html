<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성북구 중상급 영어회화 - 워크시트 스튜디오 Pro</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Fonts: Pretendard (한글) + Plus Jakarta Sans (영문) + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Pretendard:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        kr: ['Pretendard', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        studio: {
                            bg: '#0f1117',
                            panel: '#161922',
                            border: '#242838',
                            hover: '#2d3347',
                            text: '#f1f3f9',
                            muted: '#94a0b8',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 기본 스크롤바 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f1117; }
        ::-webkit-scrollbar-thumb { background: #2b3247; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3d4766; }

        /* ========================================================
           A4 인쇄 & 시뮬레이션 기본 설정 (화면 뷰)
           ======================================================== */
        :root {
            --watermark-opacity: 0.03;
            --sheet-font-scale: 1.12;
            --print-line-height: 1.72;
        }

        /* 화면 뷰에서의 실제 A4 시뮬레이션 */
        .a4-page-sheet {
            width: 210mm;
            min-height: 297mm;
            max-height: 297mm;
            padding: 13mm 16mm 12mm 16mm;
            margin: 0 auto 30px auto;
            background: #ffffff !important;
            color: #0f172a !important;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.12);
            position: relative;
            box-sizing: border-box;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: calc(10pt * var(--sheet-font-scale, 1.12));
            line-height: var(--print-line-height, 1.72);
            letter-spacing: -0.015em;
        }

        /* 워터마크 레이어 */
        .watermark-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55%;
            max-width: 360px;
            opacity: var(--watermark-opacity, 0.03);
            filter: grayscale(100%) contrast(110%);
            pointer-events: none;
            z-index: 1;
            user-select: none;
        }

        /* 인쇄 콘텐츠 영역 */
        .sheet-content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* 심플 러닝 헤더 (소프트 에디토리얼) */
        .sheet-running-header {
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 7.5pt;
            font-weight: 700;
            color: #64748b;
            flex-shrink: 0;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
        }

        /* 심플 러닝 푸터 (소프트 에디토리얼) */
        .sheet-running-footer {
            margin-top: auto;
            padding-top: 6px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 7.5pt;
            color: #94a3b8;
            font-weight: 600;
            flex-shrink: 0;
            font-family: 'JetBrains Mono', monospace;
        }

        /* 미니멀 영작 필기 라인 (단정한 노트 스타일) */
        .clean-writing-card {
            padding-bottom: 2px;
        }

        .clean-ruled-lines {
            margin-top: 6px;
            height: 90px;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 100% 30px;
            background-position: 0 28px;
        }

        /* 본문 낭독 전용 은은한 배경 박스 & 정돈된 여백 */
        .reading-script-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 18px;
        }

        /* 본문 낭독 어휘 하이라이트 (스위스 모노크롬 하이라이트) */
        .reading-keyword-highlight {
            font-weight: 800;
            color: #000000;
            border-bottom: 1.5px solid #000000;
            padding-bottom: 1px;
            display: inline;
        }
        .reading-keyword-korean {
            font-weight: 600;
            color: #334155;
            font-size: 0.92em;
            margin-left: 2px;
        }

        /* ========================================================
           🔥 인쇄 및 PDF 저장 전용 스타일 (@media print) 
           어두운 스튜디오 테마 완전 제거 & 순백색 A4 완벽 출력
           ======================================================== */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            /* 1. 최상위 html, body 순백색 강제 */
            html, body {
                background: #ffffff !important;
                background-color: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
                min-height: 100% !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* 2. 네비게이션, 좌측 패널, 줌 바 완전 숨김 */
            .no-print, header, aside, #leftControlPanel {
                display: none !important;
                width: 0 !important;
                height: 0 !important;
                overflow: hidden !important;
            }

            /* 3. 메인 뷰포트 다크 배경 무효화 */
            #previewContainerWrapper,
            main,
            .flex-1 {
                background: #ffffff !important;
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                height: auto !important;
                display: block !important;
                overflow: visible !important;
            }

            #printPreviewContainer {
                background: #ffffff !important;
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                display: block !important;
                transform: none !important;
            }

            /* 4. A4 시트 고정 인쇄 크기 및 여백 (210mm x 297mm 완벽 분할) */
            .a4-page-sheet {
                width: 210mm !important;
                min-height: 297mm !important;
                height: 297mm !important;
                max-height: 297mm !important;
                margin: 0 auto !important;
                padding: 13mm 16mm 12mm 16mm !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                page-break-before: auto !important;
                page-break-after: always !important;
                break-after: page !important;
                background: #ffffff !important;
                background-color: #ffffff !important;
                color: #000000 !important;
                box-sizing: border-box !important;
                position: relative !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .a4-page-sheet:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }

            /* 5. 낭독 박스 & 뱃지 명도 보존 */
            .reading-script-box {
                background-color: #f8fafc !important;
                border: 1px solid #e2e8f0 !important;
                border-radius: 8px !important;
                padding: 12px 18px !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .bg-gray-900 {
                background-color: #111827 !important;
                color: #ffffff !important;
            }
            .bg-gray-200 {
                background-color: #f1f5f9 !important;
                color: #0f172a !important;
            }
            .bg-gray-100 {
                background-color: #f8fafc !important;
                color: #0f172a !important;
            }
            .bg-gray-50 {
                background-color: #fafafa !important;
            }

            .watermark-layer {
                position: absolute !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                width: 55% !important;
                max-width: 360px !important;
                opacity: var(--watermark-opacity, 0.03) !important;
                filter: grayscale(100%) !important;
                z-index: 1 !important;
                pointer-events: none !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="h-full bg-studio-bg text-studio-text flex flex-col font-sans select-none">

    <!-- TOP GLOBAL NAV BAR (No Print) -->
    <header class="no-print h-14 bg-studio-panel border-b border-studio-border px-4 flex items-center justify-between shrink-0 z-30">
        <div class="flex items-center gap-3">
            <a href="index.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-studio-bg border border-studio-border hover:border-studio-hover text-zinc-300 hover:text-white transition text-xs font-semibold whitespace-nowrap">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="hidden sm:inline">키오스크</span>
            </a>
            <div class="h-4 w-px bg-studio-border hidden sm:block"></div>
            <div class="flex items-center gap-2">
                <img src="logo.png" alt="Logo" class="h-7 w-auto object-contain">
                <div class="leading-tight">
                    <h1 class="text-sm font-bold text-white flex items-center gap-1.5 whitespace-nowrap">
                        <span>워크시트 스튜디오</span>
                        <span id="headerEditionBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30 whitespace-nowrap">현장 스터디용 (6p)</span>
                    </h1>
                </div>
            </div>
        </div>

        <!-- Center: Material Edition Switcher (Full vs Teaser Preview) -->
        <div class="flex items-center gap-1 bg-studio-bg p-1 rounded-xl border border-studio-border shrink-0">
            <button id="btnEditionFull" onclick="setMaterialEdition('full')" class="edition-tab-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-emerald-600 text-white shadow whitespace-nowrap" title="표지, 웜업, 지문, 내용, 어휘, 영작, 토론 전체 포함">
                <i class="fa-solid fa-book-open mr-1"></i>현장 스터디용 (6p)
            </button>
            <button id="btnEditionTeaser" onclick="setMaterialEdition('teaser')" class="edition-tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-amber-300 transition whitespace-nowrap" title="질문 스포 방지: 타이틀, 지문 완독, 어휘/표현만 2페이지 제공">
                <i class="fa-solid fa-file-lines mr-1 text-amber-400"></i>사전 예습용 (2p)
            </button>
        </div>

        <!-- Right: Print & Copy Answers Action Buttons -->
        <div class="flex items-center gap-2 shrink-0">
            <button id="btnCopyAnswerTop" onclick="copyAnswerKeyToClipboard()" class="hidden lg:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-studio-border/70 hover:bg-studio-border text-amber-300 hover:text-amber-200 text-xs font-bold transition cursor-pointer whitespace-nowrap" title="라이팅 모범답안을 카톡 공유용으로 복사">
                <i class="fa-solid fa-clipboard-check text-amber-400"></i>
                <span>모범답안 복사</span>
            </button>
            <button onclick="loadSampleData()" class="hidden sm:inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-studio-border/70 hover:bg-studio-border text-zinc-300 hover:text-white text-xs font-medium transition cursor-pointer whitespace-nowrap" title="전문 스크립트 샘플 불러오기">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                <span>샘플</span>
            </button>
            <button id="btnPrintMainBtn" onclick="triggerA4Print()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-bold shadow-lg shadow-blue-500/25 border border-blue-400/30 active:scale-95 transition cursor-pointer whitespace-nowrap">
                <i class="fa-solid fa-print text-sm"></i>
                <span id="printBtnLabel">PDF 인쇄 (6p)</span>
            </button>
        </div>
    </header>

    <!-- MAIN STUDIO WORKSPACE (No Print) -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- LEFT: INPUT & CONTROL PANEL -->
        <aside id="leftControlPanel" class="no-print w-full md:w-[460px] lg:w-[490px] xl:w-[520px] bg-studio-panel border-r border-studio-border flex flex-col shrink-0 overflow-hidden transition-all duration-200">
            
            <!-- Controls Toolbar -->
            <div class="p-3.5 border-b border-studio-border bg-studio-panel/90 space-y-2.5 shrink-0">
                
                <!-- Option Row 1: Edition Mode Switch & Font Scale -->
                <div class="grid grid-cols-2 gap-2">
                    <!-- Edition Mode Selector -->
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-300 mb-1 flex items-center gap-1">
                            <i class="fa-solid fa-sliders text-emerald-400"></i>
                            <span>교재 모드</span>
                        </label>
                        <select id="editionSelector" onchange="setMaterialEdition(this.value)" class="w-full bg-studio-bg border border-emerald-500/50 text-emerald-200 rounded-lg px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:border-emerald-400">
                            <option value="full" selected>현장 스터디용 (6p)</option>
                            <option value="teaser">사전 예습용 (2p)</option>
                        </select>
                    </div>

                    <!-- Global Font Size Scaling -->
                    <div>
                        <label class="block text-[11px] font-bold text-amber-300 mb-1 flex items-center gap-1">
                            <i class="fa-solid fa-magnifying-glass-plus text-amber-400"></i>
                            <span>글씨 크기</span>
                        </label>
                        <select id="fontSizeSelector" onchange="changeFontSize(this.value)" class="w-full bg-studio-bg border border-amber-500/40 text-amber-100 rounded-lg px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:border-amber-400">
                            <option value="1.18">초특대 118% (시니어)</option>
                            <option value="1.12" selected>큼직한 글씨 112% (추천)</option>
                            <option value="1.06">보기 편한 106%</option>
                            <option value="1.0">표준 100%</option>
                        </select>
                    </div>
                </div>

                <!-- Option Row 2: Watermark & Quick Action -->
                <div class="grid grid-cols-2 gap-2 pt-1 border-t border-studio-border/60">
                    <div>
                        <label class="block text-[10px] font-semibold text-zinc-400 mb-1">워터마크</label>
                        <select id="watermarkSelector" onchange="changeWatermark(this.value)" class="w-full bg-studio-bg border border-studio-border rounded-lg px-2 py-1 text-xs text-zinc-200 focus:outline-none">
                            <option value="0.03" selected>은은하게 3% (권장)</option>
                            <option value="0.06">조금 진하게 (6%)</option>
                            <option value="0">끄기 (0%)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-zinc-400 mb-1">카톡 공유</label>
                        <button onclick="copyAnswerKeyToClipboard()" class="w-full bg-studio-bg hover:bg-zinc-800 border border-zinc-700 text-amber-300 hover:text-amber-200 rounded-lg px-2 py-1 text-xs font-bold transition flex items-center justify-center gap-1">
                            <i class="fa-solid fa-copy text-[10px]"></i>
                            <span>모범답안 복사</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Markdown Input Editor Area -->
            <div class="flex-1 flex flex-col p-3.5 space-y-2 overflow-hidden">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span class="text-xs font-bold text-zinc-300">Gems 마크다운 원본 붙여넣기</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="pasteFromClipboard()" class="px-2.5 py-1 rounded-lg bg-studio-bg border border-studio-border hover:border-zinc-500 text-[11px] text-zinc-300 transition" title="클립보드 붙여넣기">
                            <i class="fa-regular fa-paste mr-1"></i>붙여넣기
                        </button>
                        <button onclick="clearMarkdownInput()" class="px-2.5 py-1 rounded-lg bg-studio-bg border border-studio-border hover:border-rose-500/50 text-[11px] text-zinc-400 hover:text-rose-400 transition" title="지우기">
                            <i class="fa-solid fa-trash-can mr-1"></i>비우기
                        </button>
                    </div>
                </div>

                <div class="flex-1 relative">
                    <textarea id="markdownInput" oninput="debounceRender()" class="w-full h-full bg-[#0a0b10] border border-studio-border focus:border-blue-500 rounded-xl p-3 text-xs font-mono text-zinc-200 placeholder-zinc-600 focus:outline-none resize-none leading-relaxed select-text" placeholder="여기에 Gems에서 생성된 마크다운 전문을 붙여넣으세요. 상단 모드(현장 스터디용 6p / 사전 예습용 2p)에 따라 실시간으로 완벽하게 자동 조판됩니다."></textarea>
                </div>

                <!-- Edition Mode Guide Box -->
                <div id="editionGuideBox" class="p-2.5 rounded-xl bg-zinc-900/90 border border-zinc-700/60 text-[11px] text-zinc-300 space-y-1">
                    <div class="font-bold text-emerald-400 flex items-center justify-between">
                        <div class="flex items-center gap-1">
                            <i class="fa-solid fa-book-open"></i>
                            <span id="guideBoxTitle">현장 스터디용 (양면 3장 / 6페이지)</span>
                        </div>
                        <span id="guideBoxBadge" class="text-[10px] text-zinc-400 font-mono">Total 6 Pages</span>
                    </div>
                    <div id="guideBoxContent" class="grid grid-cols-3 gap-1.5 text-[10px] text-zinc-300 font-medium text-center pt-0.5">
                        <div class="bg-zinc-800/80 p-1.5 rounded border border-zinc-700/50">
                            <span class="text-amber-300 font-bold block">1장 (앞/뒤)</span>
                            <span>P1. 클린 표지<br>P2. 웜업+지문 1부</span>
                        </div>
                        <div class="bg-zinc-800/80 p-1.5 rounded border border-zinc-700/50">
                            <span class="text-amber-300 font-bold block">2장 (앞/뒤)</span>
                            <span>P3. 지문 2부 완독<br>P4. 내용+어휘</span>
                        </div>
                        <div class="bg-zinc-800/80 p-1.5 rounded border border-zinc-700/50">
                            <span class="text-amber-300 font-bold block">3장 (앞/뒤)</span>
                            <span>P5. 큰 글씨 영작<br>P6. 토론 8문항</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- RIGHT: LIVE A4 PRINT PREVIEW AREA -->
        <main id="previewContainerWrapper" class="flex-1 bg-[#090a0f] p-4 sm:p-6 lg:p-8 overflow-y-auto flex flex-col items-center">
            
            <!-- Floating Zoom & Action Bar for Preview (No Print) -->
            <div class="no-print sticky top-0 z-20 mb-4 px-4 py-2 rounded-2xl bg-studio-panel/90 backdrop-blur-md border border-studio-border shadow-2xl flex items-center gap-3 text-xs">
                <span class="font-bold text-zinc-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-file-lines text-blue-400"></i>
                    <span id="previewBarTitle">현장 스터디용 (6p)</span>
                </span>
                <div class="h-3 w-px bg-studio-border"></div>
                <div class="flex items-center gap-1 text-zinc-400">
                    <button onclick="adjustZoom(-0.1)" class="w-6 h-6 rounded bg-studio-bg hover:bg-studio-hover flex items-center justify-center text-xs">
                        <i class="fa-solid fa-minus"></i>
                    </button>
                    <span id="zoomLevelDisplay" class="font-mono text-[11px] px-1 font-semibold text-zinc-300">100%</span>
                    <button onclick="adjustZoom(0.1)" class="w-6 h-6 rounded bg-studio-bg hover:bg-studio-hover flex items-center justify-center text-xs">
                        <i class="fa-solid fa-plus"></i>
                    </button>

        function changeWatermark(val) {

        // LocalStorage auto-save & auto-restore for convenient local workflow
        function saveLocalState() {
            try {
                const rawMd = document.getElementById('markdownInput').value;
                if (rawMd) localStorage.setItem('worksheet_markdown_cache', rawMd);
                localStorage.setItem('worksheet_edition_cache', currentEdition);
                const fs = document.getElementById('fontSizeSelector').value;
                if (fs) localStorage.setItem('worksheet_fontsize_cache', fs);
                const wm = document.getElementById('watermarkSelector').value;
                if (wm) localStorage.setItem('worksheet_watermark_cache', wm);

        function loadLocalState() {
            try {

                const savedEdition = localStorage.getItem('worksheet_edition_cache');
                const savedFs = localStorage.getItem('worksheet_fontsize_cache');
                const savedWm = localStorage.getItem('worksheet_watermark_cache');

                if (savedFs) {

                if (savedEdition && savedEdition !== currentEdition) {
                    setMaterialEdition(savedEdition);
                }

                if (savedMd && savedMd.trim()) {
                    document.getElementById('markdownInput').value = savedMd;
                    renderLivePreview();
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // Debounce Render
        let renderTimeout = null;
        function debounceRender() {

        // ========================================================
        // 🎯 MASTER PARSER FOR 100% SCRIPT & GEMS SECTIONS
        // ========================================================
        function parseGemsMarkdown(md) {
            if (!md || !md.trim()) return null;

            const data = {
                title: 'Weekly Advanced English Study',
                overview: '',
                warmup: [],
                readingParagraphs: [],
                comprehension: [],
                vocabList: [],
                expressionList: [],
                writingList: [],
                discussionParts: {
                    partA: { title: 'Personal Perspectives & Lifestyle', questions: [] },
                    partB: { title: 'Social Trends & Cultural Dynamics', questions: [] },
                    partC: { title: 'Thought Experiments & Hypothetical Scenarios', questions: [] },
                    partD: { title: 'Hard Debates & Ethical Dilemmas', questions: [] },
                },
                answerKey: []
            };

            // 1. Extract Title
            const titleMatch = md.match(/#\s*\*{0,2}Title:?\*{0,2}\s*(.+)/i) || md.match(/Title:\s*(.+)/i);
            if (titleMatch) {
                data.title = titleMatch[1].replace(/\*\*/g, '').trim();
            }

            // 2. Extract Overview
            const overviewMatch = md.match(/\*{0,2}Overview:?\*{0,2}\s*([\s\S]+?)(?=\n---|\n###|\n\*\*1\.\s*Warm-up)/i);
            if (overviewMatch) {
                data.overview = overviewMatch[1].replace(/\*\*/g, '').trim();
            }

            // 3. Extract Warm-up Questions
            const warmupSection = md.match(/\*\*1\.\s*Warm-up[\s\S]+?(?=\n---\n\s*\*\*2|\n\*\*2\.\s*Intensive)/i);
            if (warmupSection) {
                const qRegex = /\*\*(\d+)\.\*\*\s*(.+)/g;
                let match;
                while ((match = qRegex.exec(warmupSection[0])) !== null) {
                    data.warmup.push({ num: match[1], text: match[2].trim() });
                }
            }

            // 4. Extract Intensive Reading Paragraphs (100% Full Script Guaranteed!)
            const readingSection = md.match(/\*\*2\.\s*Intensive Reading[\s\S]+?(?=\n---\n\s*\*\*3|\n\*\*3\.\s*Comprehension|\n###\s*\[\s*Answer)/i);
            if (readingSection) {
                const text = readingSection[0];
                const pRegex = /\[(\d+)\]\s*([\s\S]+?)(?=\n\s*\[\d+\]|\n---|$)/g;
                let match;
                while ((match = pRegex.exec(text)) !== null) {
                    const pNum = match[1];
                    let pContent = match[2].trim().replace(/\n+/g, ' ');
                    data.readingParagraphs.push({ num: pNum, content: pContent });
                }

                if (data.readingParagraphs.length === 0) {
                    const lines = text.split('\n');
                    let cur = null;
                    for (const line of lines) {
                        const m = line.match(/^\[(\d+)\]\s*(.+)/);
                        if (m) {
                            cur = { num: m[1], content: m[2].trim() };
                            data.readingParagraphs.push(cur);
                        } else if (cur && line.trim() && !line.startsWith('**2.') && !line.startsWith('*TED')) {
                            cur.content += ' ' + line.trim();
                        }
                    }
                }
            }

            // 5. Extract Comprehension Questions
            const compSection = md.match(/\*\*3\.\s*Comprehension Check[\s\S]+?(?=\n---\n\s*\*\*Vocabulary|\n\*\*4\.\s*Vocabulary|\n\*\*Vocabulary)/i);
            if (compSection) {
                const qRegex = /\*\*(\d+)\.\*\*\s*(.+)/g;
                let match;
                while ((match = qRegex.exec(compSection[0])) !== null) {
                    data.comprehension.push({ num: match[1], text: match[2].trim() });
                }
            }

            // 6. Extract Vocabulary (3 items)
            const vocabSection = md.match(/\*\*4\.\s*Vocabulary[\s\S]+?(?=\n\*\*5\.\s*Expression|\n\*\*5\.)/i);
            if (vocabSection) {
                const itemBlocks = vocabSection[0].split(/\n\s*\*\s*\*\*/).filter(b => b.trim() && !b.includes('Vocabulary'));
                for (const block of itemBlocks) {
                    const cleanBlock = '**' + block;
                    const wordMatch = cleanBlock.match(/\*\*\[?([^\]]+?)\]?\*\*\s*(\[.+?\])?\s*\((.+?)\)/);
                    const synMatch = cleanBlock.match(/Synonyms:\*?\s*(.+)/i);
                    const exMatch = cleanBlock.match(/Example:\*?\s*(.+)/i);

                    if (wordMatch) {
                        data.vocabList.push({
                            word: wordMatch[1].replace(/\[|\]/g, '').trim(),
                            phonetic: wordMatch[2] ? wordMatch[2].trim() : '',
                            meaning: wordMatch[3] ? wordMatch[3].trim() : '',
                            synonyms: synMatch ? synMatch[1].replace(/\*/g, '').trim() : '',
                            example: exMatch ? exMatch[1].replace(/\*/g, '').trim() : ''
                        });
                    }
                }
            }

            // 7. Extract Expressions (3 items)
            const exprSection = md.match(/\*\*5\.\s*Expression[\s\S]+?(?=\n---\n\s*\*\*☕|\n###\s*\[\s*Session 2|\n\*\*6\.\s*Writing)/i);
            if (exprSection) {
                const itemBlocks = exprSection[0].split(/\n\s*\*\s*\*\*/).filter(b => b.trim() && !b.includes('Expression'));
                for (const block of itemBlocks) {
                    const cleanBlock = '**' + block;
                    const exprMatch = cleanBlock.match(/\*\*\[?([^\]]+?)\]?\*\*\s*\((.+?)\)/);
                    const synMatch = cleanBlock.match(/Synonyms:\*?\s*(.+)/i);
                    const exMatch = cleanBlock.match(/Example:\*?\s*(.+)/i);

                    if (exprMatch) {
                        data.expressionList.push({
                            expr: exprMatch[1].replace(/\[|\]/g, '').trim(),
                            meaning: exprMatch[2] ? exprMatch[2].trim() : '',
                            synonyms: synMatch ? synMatch[1].replace(/\*/g, '').trim() : '',
                            example: exMatch ? exMatch[1].replace(/\*/g, '').trim() : ''
                        });
                    }
                }
            }

            // 8. Extract Writing Build-up Questions (5 items)
            const writingSection = md.match(/\*\*6\.\s*Writing Build-up[\s\S]+?(?=\n---\n\s*\*\*7|\n\*\*7\.\s*In-depth)/i);
            if (writingSection) {
                const qRegex = /\*\*(\d+)\.\*\*\s*(.+)/g;
                let match;
                while ((match = qRegex.exec(writingSection[0])) !== null) {
                    const line = match[2].trim();
                    const hintMatch = line.match(/\((?:힌트|Hint):\s*([^\)]+)\)/i);
                    const korean = line.replace(/\((?:힌트|Hint):[^\)]+\)/gi, '').trim();
                    data.writingList.push({
                        num: match[1],
                        korean: korean,
                        hint: hintMatch ? hintMatch[1].trim() : ''
                    });
                }
            }

            // 9. Extract Discussion Questions (Robust Section-by-Section Split by Part A, B, C, D)
            const discSection = md.match(/\*\*7\.\s*In-depth Discussion[\s\S]+?(?=\n---\n\s*###\s*\[\s*Answer|\n###\s*\[\s*Answer|$)/i);
            if (discSection) {
                const text = discSection[0];

                const parseQuestionsFromBlock = (blockStr) => {
                    if (!blockStr) return [];
                    const list = [];
                    const qRegex = /(?:\*\*(\d+)\.\*\*|^\s*(\d+)\.)\s*([^\n]+)/gm;
                    let m;
                    while ((m = qRegex.exec(blockStr)) !== null) {
                        const num = m[1] || m[2];
                        const qText = m[3].replace(/\*\*/g, '').trim();
                        if (qText && !qText.toLowerCase().startsWith('part')) {
                            list.push({ num: num, text: qText });
                        }
                    }
                    return list;
                };

                // Split text by Part A, B, C, D markers
                const partA_Block = text.match(/Part\s*A[\s\S]*?(?=Part\s*B|$)/i);
                const partB_Block = text.match(/Part\s*B[\s\S]*?(?=Part\s*C|$)/i);
                const partC_Block = text.match(/Part\s*C[\s\S]*?(?=Part\s*D|$)/i);
                const partD_Block = text.match(/Part\s*D[\s\S]*?(?=\n---|\n###|$)/i);

                if (partA_Block) data.discussionParts.partA.questions = parseQuestionsFromBlock(partA_Block[0]);
                if (partB_Block) data.discussionParts.partB.questions = parseQuestionsFromBlock(partB_Block[0]);
                if (partC_Block) data.discussionParts.partC.questions = parseQuestionsFromBlock(partC_Block[0]);
                if (partD_Block) data.discussionParts.partD.questions = parseQuestionsFromBlock(partD_Block[0]);

                // Fallback: If no Part markers exist, extract all and distribute 2 questions per part
                const totalExtracted = data.discussionParts.partA.questions.length + 
                                       data.discussionParts.partB.questions.length + 
                                       data.discussionParts.partC.questions.length + 
                                       data.discussionParts.partD.questions.length;
                
                if (totalExtracted === 0) {
                    const allQ = parseQuestionsFromBlock(text);
                    data.discussionParts.partA.questions = allQ.slice(0, 2);
                    data.discussionParts.partB.questions = allQ.slice(2, 4);
                    data.discussionParts.partC.questions = allQ.slice(4, 6);
                    data.discussionParts.partD.questions = allQ.slice(6, 8);
                }
            }

            // 10. Extract Answer Key
            const ansSection = md.match(/Writing Answers[\s\S]+$/i);
            if (ansSection) {
                const ansRegex = /\*\*(\d+)\.\*\*\s*([^\n]+)/g;
                let match;
                while ((match = ansRegex.exec(ansSection[0])) !== null) {
                    data.answerKey.push({ num: match[1], text: match[2].trim() });
                }
            }
            lastParsedAnswerKey = data.answerKey;

            return data;
        }

        // ========================================================
        // 🎨 RENDER ENGINE (DYNAMIC: FULL 6P VS TEASER PREVIEW 2P)
        // ========================================================
        function renderLivePreview() {
            const rawMd = document.getElementById('markdownInput').value;
            const container = document.getElementById('printPreviewContainer');
            if (!container) return;

            if (!rawMd || !rawMd.trim()) {
                container.innerHTML = `
                    <div class="a4-page-sheet flex items-center justify-center text-center p-12 text-zinc-400">
                        <div class="space-y-3">
                            <div class="w-16 h-16 rounded-2xl bg-zinc-100 flex items-center justify-center mx-auto text-zinc-400 text-2xl">
                                <i class="fa-solid fa-file-circle-plus"></i>
                            </div>
                            <h3 class="text-base font-bold text-zinc-700">마크다운 입력 대기 중</h3>
                            <p class="text-xs text-zinc-500 max-w-sm">
                                좌측 입력창에 Gems 마크다운을 붙여넣거나 상단의 <strong>[샘플]</strong> 버튼을 누르면 즉시 교재가 조판됩니다.
                            </p>
                        </div>
                    </div>
                `;
                return;
            }

            const data = parseGemsMarkdown(rawMd);
            if (!data) return;

            // Robust multi-pattern formatter for bold vocabulary + Korean explanation on ALL pages!
            const formatAnnotatedText = (text) => {
                let res = text.replace(/\*\*\[?([^*\]]+?)\]?\s*\(([^)]+?)\)\*\*/g, (m, eng, kor) => {
                    return `<span class="reading-keyword-highlight">${eng}<span class="reading-keyword-korean">(${kor})</span></span>`;
                });
                res = res.replace(/\*\*\[?([^*\]]+?)\]?\*\*\s*\(([^)]+?)\)/g, (m, eng, kor) => {
                    return `<span class="reading-keyword-highlight">${eng}<span class="reading-keyword-korean">(${kor})</span></span>`;
                });
                res = res.replace(/\*\*([^*]+?)\*\*/g, '<strong class="font-extrabold text-black">$1</strong>');
                return res;
            };

            const totalParas = data.readingParagraphs.length;

            // ========================================================
            // 🎁 EDITION 2: TEASER / PREVIEW HANDOUT (SUBTLE HAIRLINES)
            // ========================================================
            if (currentEdition === 'teaser') {
                
                // Calculate total character weight across all paragraphs
                let totalChars = 0;
                data.readingParagraphs.forEach(p => totalChars += p.content.length);

                // Maximize Page 1 fill: Page 1 holds ~68-70% of paragraphs (8 paragraphs out of 12)
                let teaserSplit = 8;
                if (totalParas <= 8) teaserSplit = 5;
                else if (totalParas <= 10) teaserSplit = 7;
                else if (totalParas <= 12) teaserSplit = 8;
                else if (totalParas <= 15) teaserSplit = 10;
                else teaserSplit = Math.ceil(totalParas * 0.7);

                const teaserP1Paras = data.readingParagraphs.slice(0, teaserSplit);
                const teaserP2Paras = data.readingParagraphs.slice(teaserSplit);

                // Refined typography: Natural Left Alignment with Compact Comfortable Line Length
                let scriptFontSize = "10.0pt";
                let scriptLineHeight = "1.70";

                if (totalChars > 4500) { // Extremely long script
                    scriptFontSize = "9.0pt";
                    scriptLineHeight = "1.50";
                } else if (totalChars > 3500) { // Long script
                    scriptFontSize = "9.5pt";
                    scriptLineHeight = "1.60";
                } else if (totalChars > 2600) { // Standard script
                    scriptFontSize = "10.0pt";
                    scriptLineHeight = "1.70";
                } else { // Short script
                    scriptFontSize = "10.5pt";
                    scriptLineHeight = "1.78";
                }

                let teaserHtml = `
                <!-- ================= TEASER PAGE 1 (Sheet 1 Front) : TITLE & SCRIPT 1 ================= -->
                <div class="a4-page-sheet flex flex-col justify-between p-8 sm:p-10">
                    <img src="logo.png" class="watermark-layer" alt="Watermark">

                    <div class="sheet-running-header">
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded bg-gray-900 text-white font-mono font-bold text-[7.5pt] tracking-wider">PREVIEW</span>
                            <span>성북구 중상급 영어회화 • 이번 주 스터디 사전 예습 자료</span>
                        </div>
                        <div class="text-[8pt] text-gray-700 font-bold font-mono">
                            PART 1
                        </div>
                    </div>

                    <div class="sheet-content space-y-4 flex flex-col flex-1">
                        
                        <!-- Topic Title & Overview Box (Subtle Hairline Underline) -->
                        <div class="space-y-1.5 shrink-0 pt-1 border-b border-gray-200 pb-3">
                            <div class="text-[7.5pt] font-bold text-gray-400 tracking-widest font-mono uppercase">
                                THIS WEEK'S TOPIC
                            </div>
                            <h1 class="text-xl font-black text-gray-950 tracking-tight leading-snug">
                                ${data.title}
