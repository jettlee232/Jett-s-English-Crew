<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저에 라이트 테마를 명시하여 모바일 다크 모드/인쇄 시 검은 화면 원천 차단 -->
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>성북구 중상급 영어회화 - 워크시트 스튜디오 Pro</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Fonts: Pretendard CDN + Plus Jakarta Sans (영문) + JetBrains Mono -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        kr: ['Pretendard', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        studio: {
                            bg: '#0f1117',
                            panel: '#161922',
                            border: '#242838',
                            hover: '#2d3347',
                            text: '#f1f3f9',
                            muted: '#94a0b8',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 라이트 테마를 강제 고정하여 모바일 자동 다크 인버전(Force Dark) 방지 */
        :root { color-scheme: light !important; }

        /* 헤더가 모바일에서 가로로 넘쳐 PDF 버튼을 가리는 문제.
           뱃지는 JS가 className을 통째로 덮어쓰므로 클래스가 아닌 CSS로 잡는다.
           좁은 화면에선 숨긴다 - 판형 표시는 툴바 칩과 PDF 버튼 라벨에 이미 있다. */
        #headerEditionBadge { flex-shrink: 0; }
        @media (max-width: 640px) { #headerEditionBadge { display: none; } }
        /* 기본 스크롤바 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f1117; }
        ::-webkit-scrollbar-thumb { background: #2b3247; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3d4766; }

        /* ========================================================
           A4 인쇄 & 시뮬레이션 기본 설정 (화면 뷰)
           ======================================================== */
        :root {
            --watermark-opacity: 0.03;
            --sheet-font-scale: 1.12;
            --print-line-height: 1.72;
        }

        /* 화면 뷰에서의 실제 A4 시뮬레이션 */
        .a4-page-sheet {
            width: 210mm;
            min-height: 297mm;
            max-height: 297mm;
            padding: 13mm 16mm 12mm 16mm;
            margin: 0 auto 30px auto;
            background: #ffffff !important;
            background-color: #ffffff !important;
            color: #0f172a !important;
            color-scheme: light !important;
            forced-color-adjust: none !important;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.12);
            position: relative;
            box-sizing: border-box;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: calc(10pt * var(--sheet-font-scale, 1.12));
            line-height: var(--print-line-height, 1.72);
            letter-spacing: -0.015em;
        }

        .a4-page-sheet,
        .a4-page-sheet * {
            color-scheme: light !important;
            forced-color-adjust: none !important;
        }

        /* 워터마크 레이어 */
        .watermark-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55%;
            max-width: 360px;
            opacity: var(--watermark-opacity, 0.03);
            filter: grayscale(100%) contrast(110%);
            pointer-events: none;
            z-index: 1;
            user-select: none;
        }

        /* 인쇄 콘텐츠 영역 */
        .sheet-content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* 숫자/섹션 뱃지 (흑백 인쇄 시 잉크 번짐 방지 및 선명한 가독성) */
        .sheet-num-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.5px 7px;
            border-radius: 4px;
            background-color: #f1f5f9;
            border: 1.2px solid #1e293b;
            color: #0f172a;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 8pt;
            letter-spacing: -0.01em;
            line-height: 1.25;
            box-sizing: border-box;
        }

        .sheet-tag-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.5px 7px;
            border-radius: 4px;
            background-color: #f1f5f9;
            border: 1px solid #334155;
            color: #1e293b;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 7.5pt;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1.25;
            box-sizing: border-box;
        }

        /* 심플 러닝 헤더 (흑백 인쇄 시 또렷한 그레이 라인) */
        .sheet-running-header {
            border-bottom: 1px solid #94a3b8;
            padding-bottom: 5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 7.8pt;
            font-weight: 700;
            color: #334155;
            flex-shrink: 0;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
        }

        /* 심플 러닝 푸터 (흑백 인쇄 시 날아가지 않는 경계선) */
        .sheet-running-footer {
            margin-top: auto;
            padding-top: 5px;
            border-top: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 7.8pt;
            color: #475569;
            font-weight: 700;
            flex-shrink: 0;
            font-family: 'JetBrains Mono', monospace;
        }

        /* 텍스트 줄바꿈 & 밸런스 유틸리티 */
        .break-keep {
            word-break: keep-all;
            overflow-wrap: break-word;
        }
        .text-balance {
            text-wrap: balance;
        }

        /* 미니멀 영작 필기 라인 (흑백 인쇄 시 선명하게 보이는 줄노트 라인) */
        .clean-writing-card {
            padding-bottom: 2px;
        }

        .clean-ruled-lines {
            margin-top: 6px;
            height: 90px;
            background-image: linear-gradient(#94a3b8 1px, transparent 1px);
            background-size: 100% 30px;
            background-position: 0 28px;
        }

        /* 본문 낭독 전용 은은한 배경 박스 & 선명한 경계선 */
        .reading-script-box {
            background-color: #f8fafc;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            padding: 10px 16px;
        }

        /* 본문 낭독 어휘 하이라이트 (스위스 모노크롬 하이라이트) */
        .reading-keyword-highlight {
            font-weight: 800;
            color: #000000;
            border-bottom: 1.2px solid #334155;
            padding-bottom: 1px;
            display: inline;
        }
        .reading-keyword-korean {
            font-weight: 700;
            color: #334155;
            font-size: 0.92em;
            margin-left: 2px;
        }

        /* ========================================================
           📖 리더 모드 전용 (회원/사용자가 PDF/학습자료를 볼 때 깔끔한 라이트 페이퍼 뷰)
           ======================================================== */
        .reader-mode-active,
        .reader-mode-active body {
            background-color: #f1f5f9 !important;
            color: #0f172a !important;
            color-scheme: light !important;
        }
        .reader-mode-active header {
            background-color: #ffffff !important;
            border-bottom: 1px solid #e2e8f0 !important;
        }
        .reader-mode-active #headerBrandTitle {
            color: #0f172a !important;
        }
        .reader-mode-active #previewContainerWrapper {
            background-color: #f1f5f9 !important;
        }
        .reader-mode-active .sticky {
            background-color: rgba(255, 255, 255, 0.95) !important;
            border-color: #cbd5e1 !important;
            color: #1e293b !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08) !important;
        }
        .reader-mode-active #zoomDisplay {
            color: #334155 !important;
        }
        .reader-mode-active .sticky button.bg-studio-border\/70 {
            background-color: #e2e8f0 !important;
            color: #1e293b !important;
        }
        .reader-mode-active .sticky button.bg-studio-border\/70:hover {
            background-color: #cbd5e1 !important;
        }
        .reader-mode-active .a4-page-sheet {
            background: #ffffff !important;
            background-color: #ffffff !important;
            color: #0f172a !important;
            color-scheme: light !important;
            forced-color-adjust: none !important;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.06) !important;
        }

        /* 모바일 화면 뷰 최적화 (읽기 편한 카드형 뷰) */
        @media screen and (max-width: 768px) {
            .a4-page-sheet {
                width: 100% !important;
                max-width: 100% !important;
                min-height: auto !important;
                max-height: none !important;
                padding: 20px 16px 24px 16px !important;
                margin-bottom: 20px !important;
                background: #ffffff !important;
                background-color: #ffffff !important;
                color: #0f172a !important;
                color-scheme: light !important;
                forced-color-adjust: none !important;
                border-radius: 16px !important;
                font-size: calc(9.5pt * var(--sheet-font-scale, 1.12));
            }
            .reader-mode-active #previewContainerWrapper {
                padding: 12px 8px !important;
                background-color: #f1f5f9 !important;
            }
        }

        /* ========================================================
           🔥 인쇄 및 PDF 저장 전용 스타일 (@media print) 
           흑백 인쇄 최적화: 잉크 번짐 차단 & 흐린 요소 선명 보강
           ======================================================== */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            /* 화면이 다크든 아니든 인쇄 경로는 라이트로 고정 및 강제 색상 조정 차단 */
            :root {
                color-scheme: light !important;
                forced-color-adjust: none !important;
            }

            /* 1. 최상위 html, body 순백색 강제 */
            html, body {
                color-scheme: light !important;
                forced-color-adjust: none !important;
                background: #ffffff !important;
                background-color: #ffffff !important;
                color: #0f172a !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
                min-height: 100% !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* 2. 네비게이션, 좌측 패널, 줌 바 완전 숨김 */
            .no-print, header, aside, #leftControlPanel {
                display: none !important;
                width: 0 !important;
                height: 0 !important;
                overflow: hidden !important;
            }

            /* 3. 메인 뷰포트 다크 배경 무효화 */
            #previewContainerWrapper,
            main {
                background: #ffffff !important;
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                height: auto !important;
                display: block !important;
                overflow: visible !important;
            }

            #printPreviewContainer {
                background: #ffffff !important;
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                display: block !important;
                transform: none !important;
            }

            /* 4. A4 시트 고정 인쇄 크기 및 여백 (210mm x 297mm 완벽 분할) */
            .a4-page-sheet {
                width: 210mm !important;
                min-height: 297mm !important;
                height: 297mm !important;
                max-height: 297mm !important;
                margin: 0 auto !important;
                padding: 13mm 16mm 12mm 16mm !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                page-break-before: auto !important;
                page-break-after: always !important;
                break-after: page !important;
                background: #ffffff !important;
                background-color: #ffffff !important;
                color: #0f172a !important;
                box-sizing: border-box !important;
                position: relative !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .a4-page-sheet:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }

            /* 5. 흑백 인쇄 배지 & 박스 튜닝 (뒷면 잉크 번짐 원천 방지) */
            .sheet-num-badge {
                background-color: #f1f5f9 !important;
                border: 1.2px solid #1e293b !important;
                color: #0f172a !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .sheet-tag-badge {
                background-color: #f1f5f9 !important;
                border: 1px solid #334155 !important;
                color: #0f172a !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .reading-script-box {
                background-color: #f8fafc !important;
                border: 1px solid #94a3b8 !important;
                border-radius: 6px !important;
                padding: 10px 16px !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .clean-ruled-lines {
                background-image: linear-gradient(#94a3b8 1px, transparent 1px) !important;
                background-size: 100% 30px !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* 6. 흐려서 인쇄 안 되는 보더/구분선 선명화 */
            .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300 {
                border-color: #94a3b8 !important;
            }
            .border-gray-100, .border-zinc-100 {
                border-color: #cbd5e1 !important;
            }

            /* 7. 흐려서 날아가는 보조 텍스트 선명화 */
            .text-gray-400, .text-zinc-400 {
                color: #475569 !important;
            }
            .text-gray-500, .text-zinc-500 {
                color: #334155 !important;
            }
            .text-gray-600, .text-gray-700 {
                color: #1e293b !important;
            }
            .text-gray-950, .text-gray-900, .text-zinc-950 {
                color: #0f172a !important;
            }

            .watermark-layer {
                position: absolute !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                width: 50% !important;
                max-width: 320px !important;
                opacity: 0.035 !important;
                filter: grayscale(100%) !important;
                z-index: 1 !important;
                pointer-events: none !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="h-full bg-studio-bg text-studio-text flex flex-col font-sans select-none">

    <!-- Toast Notification (Semi-Transparent Slim Capsule) -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-zinc-900/95 backdrop-blur-md text-white border border-white/15 px-4 py-2 rounded-full shadow-2xl opacity-0 -translate-y-3 pointer-events-none z-50 flex items-center gap-2 max-w-[90vw] transition-all duration-300 ease-out">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-sm shrink-0"></i>
        <span id="toastMsg" class="text-xs font-bold tracking-tight whitespace-nowrap"></span>
    </div>

    <!-- TOP GLOBAL NAV BAR (No Print) -->
    <header class="no-print h-14 bg-studio-panel border-b border-studio-border px-4 flex items-center justify-between shrink-0 z-30">
        <div class="flex items-center gap-3 min-w-0">
            <a href="index.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-studio-bg border border-studio-border hover:border-studio-hover text-zinc-300 hover:text-white transition text-xs font-semibold whitespace-nowrap">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="hidden sm:inline">키오스크</span>
            </a>
            <div class="h-4 w-px bg-studio-border hidden sm:block"></div>
            <div class="flex items-center gap-2 min-w-0">
                <img src="logo.png" alt="Logo" class="h-7 w-auto object-contain shrink-0">
                <div class="leading-tight min-w-0">
                    <h1 class="text-sm font-bold text-white flex items-center gap-1.5 min-w-0">
                        <span id="headerBrandTitle" class="truncate">워크시트 스튜디오</span>
                        <span id="headerEditionBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30 whitespace-nowrap">현장 스터디용 (6p)</span>
                    </h1>
                </div>
            </div>
        </div>

        <!-- Center: Material Edition Switcher (Full vs Teaser Preview) -->
        <div id="editionSwitcherNav" class="flex items-center gap-1 bg-studio-bg p-1 rounded-xl border border-studio-border shrink-0">
            <button id="btnEditionFull" onclick="setMaterialEdition('full')" class="edition-tab-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-emerald-600 text-white shadow whitespace-nowrap" title="표지, 웜업, 지문, 내용, 어휘, 영작, 토론 전체 포함">
                <i class="fa-solid fa-book-open mr-1"></i>현장 스터디용 (6p)
            </button>
            <button id="btnEditionTeaser" onclick="setMaterialEdition('teaser')" class="edition-tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-amber-300 transition whitespace-nowrap" title="질문 스포 방지: 타이틀, 지문 완독, 어휘/표현만 2페이지 제공">
                <i class="fa-solid fa-file-lines mr-1 text-amber-400"></i>사전 예습용 (2p)
            </button>
        </div>

        <!-- Right: Print, Publish & Action Buttons -->
        <div class="flex items-center gap-2 shrink-0">
            <button id="btnPublishToSite" onclick="publishWorksheetToMainSite()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold shadow-lg shadow-emerald-500/25 border border-emerald-400/30 active:scale-95 transition cursor-pointer whitespace-nowrap" title="작성한 워크시트와 서식을 클라우드에 저장하여 다른 PC나 기기에서 동기화합니다">
                <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                <span id="publishBtnLabel">클라우드에 저장</span>
            </button>
            <button id="btnFetchCloud" onclick="fetchWorksheetFromCloud(true)" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-studio-border/70 hover:bg-studio-border text-cyan-300 hover:text-cyan-200 text-xs font-bold transition cursor-pointer whitespace-nowrap border border-cyan-500/30 shadow-sm" title="서버에 저장된 최신 워크시트 불러오기">
                <i class="fa-solid fa-cloud-arrow-down text-cyan-400"></i>
                <span>최신 불러오기</span>
            </button>
            <button id="btnCopyAnswerTop" onclick="copyAnswerKeyToClipboard()" class="hidden lg:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-studio-border/70 hover:bg-studio-border text-amber-300 hover:text-amber-200 text-xs font-bold transition cursor-pointer whitespace-nowrap" title="라이팅 모범답안을 카톡 공유용으로 복사">
                <i class="fa-solid fa-clipboard-check text-amber-400"></i>

    <!-- JAVASCRIPT: MASTER PARSER & DUAL EDITION ENGINE (FULL 6P vs TEASER 2P) -->
    <script>
        let currentZoom = 1.0;
        let currentEdition = 'full'; // 'full' or 'teaser'
        let lastParsedAnswerKey = [];

        function adjustZoom(delta) {
            currentZoom = Math.min(Math.max(0.5, currentZoom + delta), 1.5);
            document.getElementById('zoomLevelDisplay').innerText = Math.round(currentZoom * 100) + '%';
            document.getElementById('printPreviewContainer').style.transform = `scale(${currentZoom})`;

        // Switch Material Edition (Full 6P vs Teaser 2P)
        function setMaterialEdition(edition) {
            currentEdition = edition;
            
            // Sync selectors and buttons

                printBtnLabel.innerText = "PDF 인쇄 (6p)";
                previewBarTitle.innerText = "현장 스터디용 (6p)";
                previewBarPrintBtn.innerText = "PDF 인쇄 (6p)";
                
                guideTitle.innerText = "현장 스터디용 (양면 3장 / 6페이지)";
                guideBadge.innerText = "Total 6 Pages";
                guideContent.innerHTML = `
                    <div class="bg-zinc-800/80 p-1.5 rounded border border-zinc-700/50">
                        <span class="text-amber-300 font-bold block">1장 (앞/뒤)</span>
                        <span>P1. 클린 표지<br>P2. 웜업+지문 1부</span>

                        <span class="text-amber-300 font-bold block">2장 (앞/뒤)</span>

                    </div>

                        <span class="text-amber-300 font-bold block">3장 (앞/뒤)</span>

                btnTeaser.className = "edition-tab-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-amber-600 text-white shadow whitespace-nowrap";
                headerBadge.className = "text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-bold border border-amber-500/30 whitespace-nowrap";
                headerBadge.innerText = "사전 예습용 (2p)";
                printBtnLabel.innerText = "PDF 다운로드 (2p)";
                previewBarTitle.innerText = "사전 예습용 (2p)";
                previewBarPrintBtn.innerText = "PDF 다운로드 (2p)";

                guideTitle.innerText = "사전 예습용 (양면 1장 / 2페이지 완결)";
                guideBadge.innerText = "Total 2 Pages";
                guideContent.innerHTML = `
                    <div class="bg-zinc-800/80 p-2 rounded border border-amber-500/40 col-span-3 text-left space-y-1">
                        <div class="flex items-center justify-between text-amber-300 font-bold">
                            <span>양면 1장 완결 (1P 가득 채움 & 2P 여유 조판)</span>
                            <span class="text-emerald-400 font-mono">Sheet 1</span>
                        </div>
                        <p class="text-[10px] text-zinc-300">
                            <strong>• 1페이지(앞):</strong> 토픽 + 지문 1부 ([1]~[8]단락 하단까지 가득 수록)<br>
                            <strong>• 2페이지(뒤):</strong> 지문 2부 완독 ([9]~[12]단락) + 핵심 어휘/표현 6개 + 스포 방지 안내
                        </p>
                    </div>
                `;
            }

            renderLivePreview();
        }

        function changeWatermark(val) {
            document.documentElement.style.setProperty('--watermark-opacity', val);
        }

        function changeFontSize(val) {
            document.documentElement.style.setProperty('--sheet-font-scale', val);
            const sheets = document.querySelectorAll('.a4-page-sheet');
            sheets.forEach(s => {
                s.style.fontSize = `calc(10pt * ${val})`;
            });
        }

        // Print Trigger with safe zoom reset and restoration
        // 카톡·당근·인스타 인앱 브라우저(WebView)는 window.print() 가 무반응이다(에러도 안 남).
        // 외부 브라우저로 탈출시키고, 탈출이 막힌 경우엔 안내만 띄운다.
        // ponytail: UA 스니핑. 새 인앱 브라우저가 나오면 정규식에 추가.
        const IN_APP_BROWSER_RE = /KAKAOTALK|DaumApps|NAVER\(inapp|Instagram|FB_IAB|FBAN|FBAV|Line\/|Towneers|daangn|karrot/i;

        function escapeInAppBrowser() {
            const ua = navigator.userAgent;
            if (!IN_APP_BROWSER_RE.test(ua)) return false;

            showToast("앱 안의 브라우저에선 PDF 저장이 안 돼요. Chrome/Safari로 열어주세요.", "warning");

            if (/Android/i.test(ua)) {
                // 안드로이드 WebView 표준 탈출: 기본 브라우저로 넘긴다.
                location.href = 'intent://' + location.href.replace(/^https?:\/\//, '') + '#Intent;scheme=https;end';
            } else if (/KAKAOTALK/i.test(ua)) {
                location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
            }
            return true;
        }

        function triggerA4Print() {
            if (escapeInAppBrowser()) return;

            // 탭 제스처 컨텍스트를 유지해야 iOS Safari 가 인쇄를 무시하지 않는다.
            const container = document.getElementById('printPreviewContainer');
            const originalTransform = container.style.transform;
            container.style.transform = 'none';
            container.offsetHeight; // 인쇄 전 레이아웃 강제 반영
            window.print();
            container.style.transform = originalTransform;
        }

        // LocalStorage auto-save & auto-restore for convenient local workflow
        function saveLocalState() {
            try {
                const rawMd = document.getElementById('markdownInput').value;
                localStorage.setItem('worksheet_markdown_cache', rawMd);
                localStorage.setItem('worksheet_edition_cache', currentEdition);
                const fs = document.getElementById('fontSizeSelector').value;
                if (fs) localStorage.setItem('worksheet_fontsize_cache', fs);
                const wm = document.getElementById('watermarkSelector').value;
                if (wm) localStorage.setItem('worksheet_watermark_cache', wm);
            } catch (e) {}
        }

        function loadLocalState() {
            try {
                const savedMd = localStorage.getItem('worksheet_markdown_cache');
                const savedEdition = localStorage.getItem('worksheet_edition_cache');
                const savedFs = localStorage.getItem('worksheet_fontsize_cache');
                const savedWm = localStorage.getItem('worksheet_watermark_cache');

                if (savedFs) {
                    document.getElementById('fontSizeSelector').value = savedFs;
                    changeFontSize(savedFs);
                }
                if (savedWm) {
                    document.getElementById('watermarkSelector').value = savedWm;
                    changeWatermark(savedWm);
                }
                if (savedEdition && savedEdition !== currentEdition) {
                    setMaterialEdition(savedEdition);
                }

                if (savedMd !== null) {
                    document.getElementById('markdownInput').value = savedMd;
                    renderLivePreview();
                    return true;
                }
            } catch (e) {}
            return false;
        }

        window.isSampleDataLoaded = false;

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    window.isSampleDataLoaded = false;
                    document.getElementById('markdownInput').value = text;
                    renderLivePreview();
                    saveLocalState();
                }
            } catch (err) {
                alert('클립보드 권한이 필요합니다. 텍스트를 직접 입력창에 Ctrl+V (Cmd+V) 해주세요.');
            }
        }

        function clearMarkdownInput() {
            if (confirm('입력창을 비우시겠습니까?')) {
                window.isSampleDataLoaded = false;
                document.getElementById('markdownInput').value = '';
                try { localStorage.removeItem('worksheet_markdown_cache'); } catch(e){}
                renderLivePreview();
            }
        }

        function copyAnswerKeyToClipboard() {
            if (!lastParsedAnswerKey || lastParsedAnswerKey.length === 0) {
                alert('복사할 모범 답안이 없습니다. 먼저 마크다운을 입력해주세요.');
                return;
            }
            const text = `[성북구 중상급 영어회화] 이번 주 Writing Build-up 모범답안\n\n` + 
                lastParsedAnswerKey.map(a => `${a.num}. ${a.text}`).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('카톡 전송용 모범답안이 클립보드에 복사되었습니다.\n단톡방에 바로 붙여넣기(Cmd+V)하세요.');
            }).catch(() => {
                alert('클립보드 복사에 실패했습니다.');
            });
        }

        // Debounce Render
        let renderTimeout = null;
        function debounceRender() {
            window.isSampleDataLoaded = false;
            clearTimeout(renderTimeout);
            renderTimeout = setTimeout(() => {
                renderLivePreview();
                saveLocalState();
            }, 150);
        }

        // ========================================================
        // 🎯 MASTER PARSER FOR 100% SCRIPT & GEMS SECTIONS
        // ========================================================
        function parseGemsMarkdown(md) {
            if (!md || !md.trim()) return null;

            const data = {
                title: 'Weekly Advanced English Study',
                overview: '',
                warmup: [],
                readingParagraphs: [],
                comprehension: [],
                vocabList: [],
                expressionList: [],
                writingList: [],
                discussionParts: {
                    partA: { title: 'Personal Perspectives & Lifestyle', questions: [] },
                    partB: { title: 'Social Trends & Cultural Dynamics', questions: [] },
                    partC: { title: 'Thought Experiments & Hypothetical Scenarios', questions: [] },
                    partD: { title: 'Hard Debates & Ethical Dilemmas', questions: [] },
                },
                answerKey: []
            };

            // 1. Extract Title
            const titleMatch = md.match(/#\s*\*{0,2}Title:?\*{0,2}\s*(.+)/i) || md.match(/Title:\s*(.+)/i);
            if (titleMatch) {
                data.title = titleMatch[1].replace(/\*\*/g, '').trim();
            }

            // 2. Extract Overview
            const overviewMatch = md.match(/\*{0,2}Overview:?\*{0,2}\s*([\s\S]+?)(?=\n---|\n###|\n\*\*1\.\s*Warm-up)/i);
            if (overviewMatch) {
                data.overview = overviewMatch[1].replace(/\*\*/g, '').trim();
            }

            // 3. Extract Warm-up Questions
            const warmupSection = md.match(/\*\*1\.\s*Warm-up[\s\S]+?(?=\n---\n\s*\*\*2|\n\*\*2\.\s*Intensive)/i);
            if (warmupSection) {
                const qRegex = /\*\*(\d+)\.\*\*\s*(.+)/g;
                let match;
                while ((match = qRegex.exec(warmupSection[0])) !== null) {
                    data.warmup.push({ num: match[1], text: match[2].trim() });
                }
            }

            // 4. Extract Intensive Reading Paragraphs (100% Full Script Guaranteed!)
            const readingSection = md.match(/\*\*2\.\s*Intensive Reading[\s\S]+?(?=\n---\n\s*\*\*3|\n\*\*3\.\s*Comprehension|\n###\s*\[\s*Answer)/i);
            if (readingSection) {
                const text = readingSection[0];
                const pRegex = /\[(\d+)\]\s*([\s\S]+?)(?=\n\s*\[\d+\]|\n---|$)/g;
                let match;
                while ((match = pRegex.exec(text)) !== null) {
                    const pNum = match[1];
                    let pContent = match[2].trim().replace(/\n+/g, ' ');
                    data.readingParagraphs.push({ num: pNum, content: pContent });
                }

                if (data.readingParagraphs.length === 0) {
                    const lines = text.split('\n');
                    let cur = null;
                    for (const line of lines) {
                        const m = line.match(/^\[(\d+)\]\s*(.+)/);
                        if (m) {
                            cur = { num: m[1], content: m[2].trim() };
                            data.readingParagraphs.push(cur);
                        } else if (cur && line.trim() && !line.startsWith('**2.') && !line.startsWith('*TED')) {
                            cur.content += ' ' + line.trim();
                        }
                    }
                }
            }

            // 5. Extract Comprehension Questions
            const compSection = md.match(/\*\*3\.\s*Comprehension Check[\s\S]+?(?=\n---\n\s*\*\*Vocabulary|\n\*\*4\.\s*Vocabulary|\n\*\*Vocabulary)/i);
            if (compSection) {
                const qRegex = /\*\*(\d+)\.\*\*\s*(.+)/g;
                let match;
                while ((match = qRegex.exec(compSection[0])) !== null) {
                    data.comprehension.push({ num: match[1], text: match[2].trim() });
                }
            }

            // Helper: Flexible extractor for Vocabulary and Expression blocks
            function parseVocabOrExprItems(sectionText) {
                if (!sectionText) return [];
                const items = [];
                // Split by bullets: * **, - **, 1. **, • **, etc.
                const blocks = sectionText.split(/\n\s*(?:[\*\-\•]|\d+\.)\s*(?=\*\*|\[|[A-Za-z])/).filter(b => b.trim());

                for (let rawBlock of blocks) {
                    // Skip header-only lines
                    if (/^(?:#{1,4}\s*)?(?:\*\*)?(?:Vocabulary|Expression|Core|Session|\d+\.)/i.test(rawBlock.trim()) && !rawBlock.includes('\n')) {
                        continue;
                    }

                    const lines = rawBlock.trim().split('\n');
                    const firstLine = lines[0].trim();

                    let term = '';
                    let phonetic = '';
                    let meaning = '';
                    let synonyms = '';
                    let example = '';

                    // Match term: **[Word]** or **Word** or [Word] or Word
                    const termMatch = firstLine.match(/\*\*\[?([^\]*]+?)\]?\*\*/);
                    if (termMatch) {
                        term = termMatch[1].trim();
                    } else {
                        const bracketMatch = firstLine.match(/^\[([A-Za-z\s\-']+)\]/);
                        if (bracketMatch) {
                            term = bracketMatch[1].trim();
                        } else {
                            const simpleMatch = firstLine.match(/^([A-Za-z\s\-']+)(?=\s*[\(\[\:\-])/);
                            if (simpleMatch) term = simpleMatch[1].trim();
                        }
                    }

                    if (!term) continue;

                    // Match phonetic: [ɪˈroʊd] or /ɪˈroʊd/
                    const restOfFirstLine = firstLine.replace(termMatch ? termMatch[0] : term, '').trim();
                    const phoneticMatch = restOfFirstLine.match(/(\[[^\]]+\]|\/[^\/]+\/)/);
                    if (phoneticMatch && !phoneticMatch[1].includes(term)) {
                        phonetic = phoneticMatch[1].trim();
                    }

                    // Match meaning: in (뜻) or after : or after - or after ➔
                    const meaningParenMatch = restOfFirstLine.match(/\(([^)]+)\)/);
                    if (meaningParenMatch) {
                        meaning = meaningParenMatch[1].trim();
                    } else {
                        const colonMatch = restOfFirstLine.match(/(?::|➔|-)\s*(.+)/);
                        if (colonMatch) {
                            meaning = colonMatch[1].trim();
                        }
                    }

                    // Search remaining lines for Synonyms and Example
                    const blockText = lines.slice(1).join('\n');
                    const synMatch = blockText.match(/(?:Synonyms?|유의어|유사|동의어):?\*?\s*([^\n]+)/i);
                    if (synMatch) {
                        synonyms = synMatch[1].replace(/[\*_]/g, '').trim();
                    }

                    const exMatch = blockText.match(/(?:Examples?|예문):?\*?\s*([^\n]+)/i);
                    if (exMatch) {
                        example = exMatch[1].replace(/[\*_]/g, '').trim();
                    }

                    items.push({
                        word: term,
                        expr: term,
                        phonetic: phonetic,
                        meaning: meaning,
                        synonyms: synonyms,
                        example: example
                    });
                }

                return items;
            }

            // 6. Extract Vocabulary (Core 3 items)
            const vocabSection = md.match(/(?:(?:\*\*|#{1,4}\s*|\b)4\.?\s*Vocab[\s\S]+?)(?=(?:(?:\*\*|#{1,4}\s*|\b)5\.?\s*Express|(?:\*\*|#{1,4}\s*|\b)6\.?\s*Writing|---\n\s*☕|###\s*\[\s*Session 2|$))/i) ||
                                 md.match(/(?:\*\*Vocabulary\*\*[\s\S]+?)(?=(?:\*\*Expression|###|---\n\s*☕|###\s*\[\s*Session 2|$))/i);
            if (vocabSection) {
                data.vocabList = parseVocabOrExprItems(vocabSection[0]);
            }

            // 7. Extract Expressions (Core 3 items)
            const exprSection = md.match(/(?:(?:\*\*|#{1,4}\s*|\b)5\.?\s*Express[\s\S]+?)(?=(?:(?:\*\*|#{1,4}\s*|\b)6\.?\s*Writing|---\n\s*☕|###\s*\[\s*Session 2|$))/i) ||
                                md.match(/(?:\*\*Expression\*\*[\s\S]+?)(?=(?:\*\*Writing|###|---\n\s*☕|###\s*\[\s*Session 2|$))/i);
            if (exprSection) {
                data.expressionList = parseVocabOrExprItems(exprSection[0]);
            }

            // 8. Extract Writing Build-up Questions (5 items)
            const writingSection = md.match(/(?:(?:\*\*|#{1,4}\s*|\b)6\.?\s*Writing Build-up[\s\S]+?)(?=(?:\n---\n\s*\*\*7|\n\*\*7\.\s*In-depth|###\s*\[\s*Answer|$))/i);
            if (writingSection) {
                const qRegex = /(?:\*\*(\d+)\.\*\*|^\s*(\d+)\.)\s*([^\n]+)/gm;
                let match;
                while ((match = qRegex.exec(writingSection[0])) !== null) {
                    const num = match[1] || match[2];
                    const line = match[3].trim();
                    if (!line || line.toLowerCase().includes('questions') || line.toLowerCase().includes('writing build-up')) continue;
                    
                    const hintMatch = line.match(/\((?:힌트|Hint):\s*([^\)]+)\)/i) || line.match(/\[(?:힌트|Hint):\s*([^\]]+)\]/i);
                    const korean = line.replace(/\((?:힌트|Hint):[^\)]+\)/gi, '').replace(/\[(?:힌트|Hint):[^\]]+\]/gi, '').trim();
                    data.writingList.push({
                        num: num,
                        korean: korean,
                        hint: hintMatch ? hintMatch[1].trim() : ''
                    });
                }
            }

            // 9. Extract Discussion Questions (Robust Section-by-Section Split by Part A, B, C, D)
            const discSection = md.match(/\*\*7\.\s*In-depth Discussion[\s\S]+?(?=\n---\n\s*###\s*\[\s*Answer|\n###\s*\[\s*Answer|$)/i);
            if (discSection) {
                const text = discSection[0];

                const parseQuestionsFromBlock = (blockStr) => {
                    if (!blockStr) return [];
                    const list = [];
                    const qRegex = /(?:\*\*(\d+)\.\*\*|^\s*(\d+)\.)\s*([^\n]+)/gm;
                    let m;
                    while ((m = qRegex.exec(blockStr)) !== null) {
                        const num = m[1] || m[2];
                        const qText = m[3].replace(/\*\*/g, '').trim();
                        if (qText && !qText.toLowerCase().startsWith('part')) {
                            list.push({ num: num, text: qText });
                        }
                    }
                    return list;
                };

                // Split text by Part A, B, C, D markers
                const partA_Block = text.match(/Part\s*A[\s\S]*?(?=Part\s*B|$)/i);
                const partB_Block = text.match(/Part\s*B[\s\S]*?(?=Part\s*C|$)/i);
                const partC_Block = text.match(/Part\s*C[\s\S]*?(?=Part\s*D|$)/i);
                const partD_Block = text.match(/Part\s*D[\s\S]*?(?=\n---|\n###|$)/i);

                if (partA_Block) data.discussionParts.partA.questions = parseQuestionsFromBlock(partA_Block[0]);
                if (partB_Block) data.discussionParts.partB.questions = parseQuestionsFromBlock(partB_Block[0]);
                if (partC_Block) data.discussionParts.partC.questions = parseQuestionsFromBlock(partC_Block[0]);
                if (partD_Block) data.discussionParts.partD.questions = parseQuestionsFromBlock(partD_Block[0]);

                // Fallback: If no Part markers exist, extract all and distribute 2 questions per part
                const totalExtracted = data.discussionParts.partA.questions.length + 
                                       data.discussionParts.partB.questions.length + 
                                       data.discussionParts.partC.questions.length + 
                                       data.discussionParts.partD.questions.length;
                
                if (totalExtracted === 0) {
                    const allQ = parseQuestionsFromBlock(text);
                    data.discussionParts.partA.questions = allQ.slice(0, 2);
                    data.discussionParts.partB.questions = allQ.slice(2, 4);
                    data.discussionParts.partC.questions = allQ.slice(4, 6);
                    data.discussionParts.partD.questions = allQ.slice(6, 8);
                }
            }

            // 10. Extract Answer Key
            const ansSection = md.match(/Writing Answers[\s\S]+$/i);
            if (ansSection) {
                const ansRegex = /\*\*(\d+)\.\*\*\s*([^\n]+)/g;
                let match;
                while ((match = ansRegex.exec(ansSection[0])) !== null) {
                    data.answerKey.push({ num: match[1], text: match[2].trim() });
                }
            }
            lastParsedAnswerKey = data.answerKey;

            return data;
        }

            const btn = document.getElementById('btnFetchCloud');
            try {
                if (btn) btn.classList.add('opacity-50', 'pointer-events-none');
                const snap = await getDoc(worksheetDocRef);
                if (snap.exists() && snap.data()?.markdown) {
                    const data = snap.data();
                    latestPublished = data;
                    if (isReaderMode) {
                        applyPublishedToReader(data);
                    } else {
                        applyPublishedToStudio(data, notify);
                    }
                } else {
                    if (notify) showToast("⚠️ 서버에 저장된 워크시트가 없습니다.", "warning");
                }
            } catch (err) {
                console.warn("Cloud fetch error:", err);
                if (notify) showToast("❌ 워크시트 불러오기 실패: " + (err.message || "오류"), "error");
            } finally {
                if (btn) btn.classList.remove('opacity-50', 'pointer-events-none');
            }
        };

        // Real-time listener for published worksheet
        onSnapshot(worksheetDocRef, (snap) => {
            if (!snap.exists()) return;
            const data = snap.data();
            if (!data || !data.markdown) return;

            latestPublished = data;

            if (isReaderMode) {
                applyPublishedToReader(data);
            } else {
                const currentInput = document.getElementById('markdownInput').value.trim();
                // 입력창이 비어있거나 샘플 데이터 상태이거나 로컬 캐시가 없으면 서버 최신본 자동 로드
                if (!currentInput || window.isSampleDataLoaded || !localStorage.getItem('worksheet_markdown_cache')) {
                    applyPublishedToStudio(data, false);
                }
            }
        }, (err) => {
            console.warn("Firestore worksheet read warning:", err);
        });

        // 🚀 One-Click Publish to Main Site
        window.publishWorksheetToMainSite = async function() {
            const isTrustedLeader = localStorage.getItem('isTrustedLeaderDevice') === 'true';
            if (isReaderMode && !isTrustedLeader) {
                showToast("⚠️ 리더만 학습자료를 발행할 수 있습니다.", "warning");
                return;
            }

            const rawMd = document.getElementById('markdownInput').value.trim();
            if (!rawMd) {
                showToast("⚠️ 먼저 Gems 마크다운 내용을 입력해 주세요!", "warning");
                return;
            }

            const btn = document.getElementById('btnPublishToSite');
            const label = document.getElementById('publishBtnLabel');
            const originalText = label ? label.innerText : "클라우드에 저장";

            try {
                if (label) label.innerText = "저장 중...";
                if (btn) btn.disabled = true;

                // Ensure authenticated
                if (!auth.currentUser) {
                    try {
                        await signInAnonymously(auth);
                    } catch (e) {
                        console.warn("Auth retry warning:", e);
                    }
                }

                const parsed = window.parseGemsMarkdown(rawMd);
                const activeEdition = window.currentEdition || 'teaser';
                const fs = document.getElementById('fontSizeSelector')?.value || '1.12';
                const wm = document.getElementById('watermarkSelector')?.value || 'none';

                // 1. Save to worksheet doc (마크다운, 판형, 글자크기, 워터마크 통째로 클라우드 저장)
                await setDoc(worksheetDocRef, {
                    markdown: rawMd,
                    title: parsed.title || "이번 주 스터디 주제",
                    overview: parsed.overview || "",
                    edition: activeEdition,
                    fontSize: fs,
                    watermark: wm,
                    publishedAt: Date.now()
                }, { merge: true });

                showToast("🎉 학습자료가 클라우드에 저장/연동되었습니다.", "success");
            } catch (error) {
                console.error("발행 실패 상세 에러:", error);
                showToast("❌ 연동 중 오류가 발생했습니다: " + (error.message || "권한 오류"), "error");
            } finally {
                if (label) label.innerText = originalText;
                if (btn) btn.disabled = false;
            }
        };
    </script>
</body>
</html>
